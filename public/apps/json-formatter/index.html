<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formateador & Validador JSON — Ramón Menor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
    }
    .back-link {
      font-size: 13px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .back-link:hover { text-decoration: underline; }
    .title-box { display: flex; align-items: center; gap: 8px; }
    .badge {
      font-size: 11px;
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    main {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 10px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .btn-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    button {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      transition: all 0.15s;
    }
    button:hover { background: #f1f5f9; border-color: #94a3b8; }
    .btn-primary { background: #2563eb; color: #ffffff; border-color: #2563eb; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-dark { background: #0f172a; color: #ffffff; border-color: #0f172a; }
    .btn-dark:hover { background: #1e293b; }
    select {
      padding: 7px 10px;
      font-size: 13px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      outline: none;
    }
    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      flex: 1;
      min-height: 480px;
    }
    @media (max-width: 800px) {
      .workspace { grid-template-columns: 1fr; }
    }
    .panel {
      display: flex;
      flex-direction: column;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      overflow: hidden;
    }
    .panel-header {
      padding: 10px 16px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      display: flex;
      justify-content: space-between;
    }
    textarea {
      flex: 1;
      width: 100%;
      border: none;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.6;
      resize: none;
      outline: none;
      background: #ffffff;
    }
    pre {
      flex: 1;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.6;
      background: #0f172a;
      color: #f8fafc;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="back-link">← ramonmenor.es</a>
    <div class="title-box">
      <strong style="font-size: 15px;">Formateador & Validador JSON</strong>
      <span class="badge">Pública</span>
    </div>
    <div style="font-size: 12px; color: #64748b; font-family: monospace;">Apps // JSON</div>
  </header>

  <main>
    <div class="toolbar">
      <div class="btn-group">
        <button class="btn-primary" id="btn-format">✨ Formatear</button>
        <button id="btn-minify">Compactar (Minify)</button>
        <button id="btn-sample">Cargar ejemplo</button>
        <button id="btn-clear" style="color: #dc2626;">Limpiar</button>
      </div>

      <div class="btn-group">
        <label style="font-size: 12px; color: #64748b;">Sangría:</label>
        <select id="indent-select">
          <option value="2">2 espacios</option>
          <option value="4">4 espacios</option>
          <option value="tab">Tabulador</option>
        </select>
        <button class="btn-dark" id="btn-copy">Copiar Resultado</button>
      </div>
    </div>

    <div class="workspace">
      <div class="panel">
        <div class="panel-header">
          <span>JSON ORIGINAL</span>
          <span id="char-count">0 caracteres</span>
        </div>
        <textarea id="input-json" placeholder="Pega aquí tu JSON..." spellcheck="false"></textarea>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span>RESULTADO</span>
          <span id="status-text" style="color: #94a3b8;">Esperando datos</span>
        </div>
        <pre id="output-json">// El resultado formateado aparecerá aquí...</pre>
      </div>
    </div>
  </main>

  <script>
    const input = document.getElementById('input-json');
    const output = document.getElementById('output-json');
    const status = document.getElementById('status-text');
    const charCount = document.getElementById('char-count');
    const indentSelect = document.getElementById('indent-select');
    const btnCopy = document.getElementById('btn-copy');

    function getIndent() {
      const v = indentSelect.value;
      if (v === '4') return 4;
      if (v === 'tab') return '\t';
      return 2;
    }

    function format() {
      const text = input.value.trim();
      charCount.textContent = `${text.length} caracteres`;
      if (!text) {
        output.textContent = '// El resultado formateado aparecerá aquí...';
        status.textContent = 'Esperando datos';
        status.style.color = '#94a3b8';
        return;
      }
      try {
        const obj = JSON.parse(text);
        output.textContent = JSON.stringify(obj, null, getIndent());
        status.textContent = '✓ JSON Válido';
        status.style.color = '#10b981';
      } catch (e) {
        output.textContent = 'Error de sintaxis:\n' + e.message;
        status.textContent = '✕ Error';
        status.style.color = '#ef4444';
      }
    }

    document.getElementById('btn-format').addEventListener('click', format);
    document.getElementById('btn-minify').addEventListener('click', () => {
      try {
        const obj = JSON.parse(input.value.trim());
        output.textContent = JSON.stringify(obj);
        status.textContent = '✓ Minificado';
        status.style.color = '#10b981';
      } catch (e) {
        output.textContent = 'Error: ' + e.message;
      }
    });

    document.getElementById('btn-sample').addEventListener('click', () => {
      input.value = JSON.stringify({
        app: "json-formatter",
        version: "1.0.0",
        autor: "Ramón Menor",
        features: ["offline", "privacy-first", "instant"]
      }, null, 2);
      format();
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      input.value = '';
      format();
    });

    indentSelect.addEventListener('change', format);
    input.addEventListener('input', format);

    btnCopy.addEventListener('click', () => {
      const t = output.textContent;
      if (t && !t.startsWith('//') && !t.startsWith('Error')) {
        navigator.clipboard.writeText(t).then(() => {
          btnCopy.textContent = '¡Copiado!';
          setTimeout(() => btnCopy.textContent = 'Copiar Resultado', 1500);
        });
      }
    });
  </script>
</body>
</html>
