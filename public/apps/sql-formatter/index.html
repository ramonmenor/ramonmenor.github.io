<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formateador SQL — Ramón Menor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
    }
    .back-link {
      font-size: 13px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }
    .back-link:hover { text-decoration: underline; }
    .badge {
      font-size: 11px;
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    main {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 10px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    button {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
    }
    button:hover { background: #f1f5f9; }
    .btn-primary { background: #2563eb; color: #ffffff; border-color: #2563eb; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-dark { background: #0f172a; color: #ffffff; border-color: #0f172a; }
    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      flex: 1;
      min-height: 480px;
    }
    @media (max-width: 800px) {
      .workspace { grid-template-columns: 1fr; }
    }
    .panel {
      display: flex;
      flex-direction: column;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      overflow: hidden;
    }
    .panel-header {
      padding: 10px 16px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      display: flex;
      justify-content: space-between;
    }
    textarea {
      flex: 1;
      width: 100%;
      border: none;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.6;
      resize: none;
      outline: none;
    }
    pre {
      flex: 1;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.6;
      background: #0f172a;
      color: #f8fafc;
      overflow: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="back-link">← ramonmenor.es</a>
    <div style="display: flex; align-items: center; gap: 8px;">
      <strong style="font-size: 15px;">Formateador SQL</strong>
      <span class="badge">Pública</span>
    </div>
    <div style="font-size: 12px; color: #64748b; font-family: monospace;">Apps // SQL</div>
  </header>

  <main>
    <div class="toolbar">
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="btn-primary" id="btn-format">✨ Formatear SQL</button>
        <button id="btn-minify">Una sola línea</button>
        <button id="btn-sample">Cargar ejemplo</button>
        <button id="btn-clear" style="color: #dc2626;">Limpiar</button>
      </div>
      <div>
        <button class="btn-dark" id="btn-copy">Copiar Resultado</button>
      </div>
    </div>

    <div class="workspace">
      <div class="panel">
        <div class="panel-header">
          <span>SQL ORIGINAL</span>
          <span id="char-count">0 caracteres</span>
        </div>
        <textarea id="sql-input" placeholder="Pega aquí tu consulta SQL..." spellcheck="false"></textarea>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span>SQL FORMATEADO</span>
          <span style="color: #10b981;">Estándar ANSI</span>
        </div>
        <pre id="sql-output">// El SQL formateado aparecerá aquí...</pre>
      </div>
    </div>
  </main>

  <script>
    const input = document.getElementById('sql-input');
    const output = document.getElementById('sql-output');
    const charCount = document.getElementById('char-count');
    const btnCopy = document.getElementById('btn-copy');

    const sample = `select u.id, u.nombre, u.email, count(p.id) as pedidos from usuarios u left join pedidos p on u.id = p.usuario_id where u.activo = 1 group by u.id, u.nombre, u.email order by pedidos desc limit 10;`;

    const keywords = [
      'SELECT', 'FROM', 'WHERE', 'AND', 'OR', 'LEFT JOIN', 'RIGHT JOIN', 'INNER JOIN', 'FULL JOIN', 'JOIN',
      'ON', 'GROUP BY', 'HAVING', 'ORDER BY', 'LIMIT', 'OFFSET', 'UNION', 'INSERT INTO', 'VALUES',
      'UPDATE', 'SET', 'DELETE FROM', 'AS', 'COUNT', 'SUM', 'AVG', 'MIN', 'MAX', 'DESC', 'ASC'
    ];

    function format() {
      let t = input.value.trim();
      charCount.textContent = `${t.length} caracteres`;
      if (!t) {
        output.textContent = '// El SQL formateado aparecerá aquí...';
        return;
      }
      t = t.replace(/\s+/g, ' ');
      keywords.forEach(kw => {
        const re = new RegExp(`\\b${kw}\\b`, 'gi');
        t = t.replace(re, kw);
      });
      keywords.forEach(kw => {
        const re = new RegExp(`\\s+(${kw})\\s+`, 'g');
        t = t.replace(re, `\n$1 `);
      });
      t = t.replace(/,\s*/g, ',\n  ');
      output.textContent = t;
    }

    document.getElementById('btn-format').addEventListener('click', format);
    document.getElementById('btn-minify').addEventListener('click', () => {
      let t = input.value.trim().replace(/\s+/g, ' ');
      output.textContent = t;
    });
    document.getElementById('btn-sample').addEventListener('click', () => {
      input.value = sample;
      format();
    });
    document.getElementById('btn-clear').addEventListener('click', () => {
      input.value = '';
      format();
    });
    input.addEventListener('input', format);

    btnCopy.addEventListener('click', () => {
      const t = output.textContent;
      if (t && !t.startsWith('//')) {
        navigator.clipboard.writeText(t).then(() => {
          btnCopy.textContent = '¡Copiado!';
          setTimeout(() => btnCopy.textContent = 'Copiar Resultado', 1500);
        });
      }
    });
  </script>
</body>
</html>
