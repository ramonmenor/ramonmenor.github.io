<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Herramientas Externas — Ramón Menor</title>
  <!-- Access Control Guard & Mobile Nav -->
  <link rel="stylesheet" href="/apps/shared/app-nav.css">
  <script src="/apps/shared/auth-guard.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #080d16;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 20px 80px;
      flex: 1;
    }
    .header-area {
      margin-bottom: 24px;
    }
    .overline {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 6px;
    }
    .main-title {
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    /* Layout: Left Form + Right Grid */
    .tools-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      align-items: start;
    }

    .form-card {
      background: #0c1322;
      border: 1px solid #172338;
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .form-title {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #64748b;
    }
    .input-field {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      background: #090e18;
      border: 1px solid #162236;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s ease;
    }
    .input-field:focus {
      border-color: #00f0ff;
    }
    .input-field::placeholder {
      color: #475569;
    }
    .btn-submit {
      background: #00e5ff;
      color: #080d16;
      border: none;
      font-weight: 700;
      font-size: 13px;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
      box-shadow: 0 0 15px -3px rgba(0, 229, 255, 0.3);
      align-self: flex-start;
    }
    .btn-submit:active {
      transform: scale(0.98);
      background: #00c8e0;
    }
    .btn-cancel {
      background: transparent;
      color: #64748b;
      border: 1px solid #1e2e4a;
      font-weight: 600;
      font-size: 13px;
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
      display: none;
    }

    /* Right Cards Grid */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .tool-card {
      background: #0c1322;
      border: 1px solid #172338;
      border-radius: 18px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: border-color 0.15s ease;
    }
    .tool-card:hover {
      border-color: #243550;
    }
    .tool-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .tool-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #64748b;
    }
    .tool-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
    }
    .btn-action {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-family: inherit;
      padding: 2px 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .btn-action:hover {
      color: #00f0ff;
    }
    .btn-delete:hover {
      color: #f43f5e;
    }
    .tool-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .tool-desc {
      font-size: 13px;
      color: #64748b;
      line-height: 1.4;
    }
    .tool-link {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #00f0ff;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      align-self: flex-start;
      margin-top: 4px;
    }
    .tool-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 820px) {
      .tools-layout {
        grid-template-columns: 1fr;
      }
      main {
        padding: 20px 14px 80px;
      }
    }
  </style>
</head>
<body>
  <header>
    <!-- Managed by auth-guard.js -->
  </header>

  <main>
    <div class="header-area">
      <div class="overline">ACCESOS DIRECTOS</div>
      <h1 class="main-title">Herramientas externas</h1>
    </div>

    <div class="tools-layout">
      <!-- Formulario para agregar / editar -->
      <form id="form-tool" class="form-card">
        <div class="form-title" id="form-heading">NUEVO ACCESO</div>
        <input
          type="text"
          id="input-tool-name"
          class="input-field"
          placeholder="Nombre, p. ej. Mi banco"
          required
        />
        <input
          type="text"
          id="input-tool-desc"
          class="input-field"
          placeholder="Descripción corta"
        />
        <input
          type="text"
          id="input-tool-url"
          class="input-field"
          placeholder="URL, p. ej. ejemplo.com"
          required
        />
        <div style="display: flex; gap: 8px;">
          <button type="submit" id="btn-submit-tool" class="btn-submit">Añadir acceso</button>
          <button type="button" id="btn-cancel-edit" class="btn-cancel">Cancelar</button>
        </div>
      </form>

      <!-- Lista de herramientas externas -->
      <div class="tools-grid" id="tools-container">
        <!-- Rendered dynamically by JavaScript -->
      </div>
    </div>
  </main>

  <script>
    const STORAGE_KEY = 'rm_external_tools_state';

    const DEFAULT_TOOLS = [
      {
        id: '1',
        title: 'Nube de archivos',
        desc: 'Documentos y backup',
        url: 'https://drive.google.com'
      },
      {
        id: '2',
        title: 'Calendario',
        desc: 'Agenda semanal',
        url: 'https://calendar.google.com'
      },
      {
        id: '3',
        title: 'Lector de notas',
        desc: 'Notas y listas',
        url: 'https://keep.google.com'
      }
    ];

    let tools = [];
    let editingId = null;

    function loadTools() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          tools = JSON.parse(saved);
        } else {
          tools = DEFAULT_TOOLS;
        }
      } catch (e) {
        tools = DEFAULT_TOOLS;
      }
    }

    function saveTools() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tools));
        // Disparar evento para que otras vistas o páginas se sincronicen
        window.dispatchEvent(new CustomEvent('rm_external_tools_updated'));
      } catch (e) {}
    }

    function sanitizeUrl(raw) {
      let u = raw.trim();
      if (!u.startsWith('http://') && !u.startsWith('https://')) {
        u = 'https://' + u;
      }
      return u;
    }

    function renderTools() {
      const container = document.getElementById('tools-container');
      if (!container) return;
      container.innerHTML = '';

      if (tools.length === 0) {
        container.innerHTML = '<div style="color: #64748b; font-size: 13px; font-family: monospace; grid-column: 1 / -1; padding: 20px;">No hay accesos directos aún. Crea el primero desde el formulario.</div>';
        return;
      }

      tools.forEach(tool => {
        const card = document.createElement('div');
        card.className = 'tool-card';
        card.innerHTML = `
          <div>
            <div class="tool-card-header">
              <span class="tool-tag">EXTERNO</span>
              <div class="tool-actions">
                <button type="button" class="btn-action btn-edit" data-id="${tool.id}">EDITAR</button>
                <button type="button" class="btn-action btn-delete" data-id="${tool.id}" title="Eliminar">✕</button>
              </div>
            </div>
            <div style="margin-top: 10px;">
              <div class="tool-title">${tool.title}</div>
              <div class="tool-desc">${tool.desc || ''}</div>
            </div>
          </div>
          <a href="${sanitizeUrl(tool.url)}" target="_blank" rel="noopener noreferrer" class="tool-link">
            Abrir ↗
          </a>
        `;
        container.appendChild(card);
      });

      // Bind edit
      container.querySelectorAll('.btn-edit').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          startEdit(id);
        });
      });

      // Bind delete
      container.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          if (confirm('¿Eliminar este acceso directo?')) {
            tools = tools.filter(t => t.id !== id);
            if (editingId === id) cancelEdit();
            saveTools();
            renderTools();
          }
        });
      });
    }

    function startEdit(id) {
      const tool = tools.find(t => t.id === id);
      if (!tool) return;

      editingId = id;
      document.getElementById('form-heading').textContent = 'EDITAR ACCESO';
      document.getElementById('input-tool-name').value = tool.title;
      document.getElementById('input-tool-desc').value = tool.desc || '';
      document.getElementById('input-tool-url').value = tool.url;
      document.getElementById('btn-submit-tool').textContent = 'Guardar cambios';
      document.getElementById('btn-cancel-edit').style.display = 'inline-block';
      document.getElementById('input-tool-name').focus();
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('form-heading').textContent = 'NUEVO ACCESO';
      document.getElementById('input-tool-name').value = '';
      document.getElementById('input-tool-desc').value = '';
      document.getElementById('input-tool-url').value = '';
      document.getElementById('btn-submit-tool').textContent = 'Añadir acceso';
      document.getElementById('btn-cancel-edit').style.display = 'none';
    }

    document.getElementById('btn-cancel-edit').addEventListener('click', cancelEdit);

    document.getElementById('form-tool').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('input-tool-name').value.trim();
      const desc = document.getElementById('input-tool-desc').value.trim();
      const rawUrl = document.getElementById('input-tool-url').value.trim();

      if (!title || !rawUrl) return;
      const url = sanitizeUrl(rawUrl);

      if (editingId) {
        const item = tools.find(t => t.id === editingId);
        if (item) {
          item.title = title;
          item.desc = desc;
          item.url = url;
        }
        cancelEdit();
      } else {
        tools.push({
          id: String(Date.now()),
          title: title,
          desc: desc,
          url: url
        });
        cancelEdit();
      }

      saveTools();
      renderTools();
    });

    // Init
    loadTools();
    renderTools();
  </script>
</body>
</html>
