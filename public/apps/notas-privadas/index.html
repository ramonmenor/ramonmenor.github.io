<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notas Privadas — Ramón Menor</title>
  <!-- Access Control Guard -->
  <script src="/apps/shared/auth-guard.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
    }
    .back-link { font-size: 13px; color: #2563eb; text-decoration: none; font-weight: 500; }
    .badge-private {
      font-size: 11px;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    main { max-width: 900px; width: 100%; margin: 0 auto; padding: 24px; flex: 1; display: flex; flex-direction: column; }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    button {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
    }
    button:hover { background: #f1f5f9; }
    .btn-danger { color: #dc2626; border-color: #fecaca; }
    .btn-danger:hover { background: #fef2f2; }
    textarea {
      flex: 1;
      width: 100%;
      min-height: 500px;
      padding: 20px;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.7;
      outline: none;
      resize: none;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
    }
    textarea:focus { border-color: #2563eb; ring: 2px solid #2563eb; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="back-link">← ramonmenor.es</a>
    <div style="display: flex; align-items: center; gap: 8px;">
      <strong style="font-size: 15px;">Bloc de Notas Privado</strong>
      <span class="badge-private">🔒 Privada (Protegida)</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <button onclick="window.RMAccess.lock()" style="font-size: 12px; color: #dc2626;">Bloquear Sesión</button>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div style="font-size: 12px; color: #64748b;">
        <span id="save-status">✓ Guardado automático en este equipo</span>
      </div>
      <div>
        <button id="btn-copy">Copiar Todo</button>
        <button id="btn-clear" class="btn-danger">Borrar Notas</button>
      </div>
    </div>

    <textarea id="notes-area" placeholder="Escribe aquí tus notas, tareas, ideas o apuntes confidenciales. Se guardan automáticamente al escribir..."></textarea>
  </main>

  <script>
    const area = document.getElementById('notes-area');
    const saveStatus = document.getElementById('save-status');
    const STORAGE_KEY = 'rm_private_notes_content';

    // Load saved notes
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      area.value = saved;
    }

    // Autosave on input
    area.addEventListener('input', () => {
      localStorage.setItem(STORAGE_KEY, area.value);
      saveStatus.textContent = 'Guardando...';
      saveStatus.style.color = '#eab308';
      setTimeout(() => {
        saveStatus.textContent = '✓ Guardado automáticamente';
        saveStatus.style.color = '#10b981';
      }, 500);
    });

    document.getElementById('btn-copy').addEventListener('click', function() {
      if (area.value) {
        navigator.clipboard.writeText(area.value).then(() => {
          this.textContent = '¡Copiado!';
          setTimeout(() => this.textContent = 'Copiar Todo', 1500);
        });
      }
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      if (confirm('¿Estás seguro de que deseas borrar todas las notas?')) {
        area.value = '';
        localStorage.removeItem(STORAGE_KEY);
      }
    });
  </script>
</body>
</html>
